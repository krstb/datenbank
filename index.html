<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenbank Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .container { margin: 0 auto; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.7); z-index: 50; }
        .modal-fixed-height { display: flex; flex-direction: column; max-height: 90vh; }
        .modal-content-scroll { flex-grow: 1; overflow-y: auto; padding-bottom: 1rem; }
        .results-table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 65vh; overflow-y: auto; }
        .results-table-container table { table-layout: auto; }
        .results-table-container th, .results-table-container td { white-space: nowrap; width: 1%; }
        .results-table-container thead th { position: sticky; top: 0; z-index: 10; background-color: #e5e7eb; box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1); }
        mark { background-color: #fef08a; color: #000; padding: 0 1px; border-radius: 2px; }
    </style>
</head>
<body class="p-1 sm:p-4">

    <div class="container bg-white shadow-2xl rounded-xl p-3 md:p-6 max-w-7xl">

        <h1 class="text-xl sm:text-2xl md:text-4xl font-extrabold text-gray-800 mb-4 md:mb-6 border-b pb-3 flex items-center flex-wrap gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8 text-indigo-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>Datenbank</span>
            <span id="mainTitle" class="text-sm sm:text-lg md:text-2xl font-medium text-gray-500 break-all border-l pl-2 ml-1">Keine Datei geladen</span>
            <span id="storageHint" class="text-[10px] sm:text-xs font-normal text-gray-400 italic hidden">(aus Speicher)</span>
        </h1>
        
        <div class="mb-6 p-2 md:p-3 border border-indigo-200 bg-indigo-50 rounded-lg flex flex-row items-center justify-between gap-2">
            <div class="flex-shrink-0">
                <input type="file" id="csvFile" accept=".csv,.xlsx,.xls" class="hidden" onchange="loadFile(event)">
                <button onclick="document.getElementById('csvFile').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 sm:py-2 sm:px-4 rounded-lg shadow-md transition duration-150 ease-in-out text-xs sm:text-sm flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 mr-1 sm:mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    <span>Laden</span>
                </button>
            </div>
            
            <div class="flex-shrink-0">
                 <button onclick="exportAllResultsAsXLSX()" id="exportXlsxButton" 
                  class="bg-green-600 hover:bg-green-700 text-white font-bold py-1.5 px-3 sm:py-2 sm:px-4 rounded-lg shadow-md transition duration-150 ease-in-out text-xs sm:text-sm opacity-50 pointer-events-none flex items-center"
                   disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 sm:mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    <span class="hidden sm:inline">Als XLSX herunterladen</span>
                    <span class="inline sm:hidden ml-1">XLSX</span>
                </button>
            </div>
        </div>

        <div id="searchContainer" class="mb-6 p-3 md:p-4 border border-gray-300 rounded-lg opacity-50 pointer-events-none transition duration-300 space-y-2">
            <label class="block text-base md:text-lg font-semibold text-gray-700">Suchkriterien</label>
            <div class="flex gap-2 md:gap-3 items-end">
                <div class="w-1/2">
                    <label for="columnSelect1" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Spalte:</label>
                    <select id="columnSelect1" class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="handleColumnChange(1); saveState();"></select>
                </div>
                <div class="w-1/2">
                    <label for="searchInput1" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Suchbegriff:</label>
                    <input type="text" id="searchInput1" placeholder="=10, >10, leer, Müller" class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="searchCSV(); saveState();">
                </div>
            </div>
            <div class="flex items-center py-1">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-3 text-[10px] text-gray-400 font-bold">UND</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>
            <div class="flex gap-2 md:gap-3 items-end">
                <div class="w-1/2">
                    <label for="columnSelect2" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Spalte:</label>
                    <select id="columnSelect2" class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="handleColumnChange(2); saveState();"></select>
                </div>
                <div class="w-1/2">
                    <label for="searchInput2" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Suchbegriff:</label>
                    <input type="text" id="searchInput2" placeholder="=10, >10, leer, Müller" class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="searchCSV(); saveState();">
                </div>
            </div>
        </div>

        <div class="mt-6 md:mt-10">
            <div class="flex flex-row justify-between items-center mb-3">
                <h2 id="resultsHeader" class="text-lg md:text-2xl font-bold text-gray-800"><span id="resultCount">0</span> Ergebnisse</h2>
            </div>
            <div id="resultsOutput" class="results-table-container shadow-inner bg-gray-50 rounded-lg">
                <p class="text-gray-500 p-3 text-xs sm:text-sm">Bitte Datei laden.</p>
            </div>
        </div>
    </div>

    <button id="scrollToTopBtn" onclick="scrollToTop()" class="hidden fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-full shadow-lg z-20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
    </button>

    <div id="rowModal" class="fixed inset-0 hidden items-center justify-center modal-overlay" onclick="closeRowPopup()">
        <div class="bg-white rounded-xl shadow-2xl p-4 md:p-8 max-w-lg w-11/12 modal-fixed-height" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start border-b pb-2 mb-4 flex-shrink-0">
                <h3 class="text-lg font-bold text-gray-900">Details (<span id="modalCounter">1/1</span>)</h3>
                <button onclick="closeRowPopup()" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="modalContent" class="modal-content-scroll text-xs sm:text-sm"></div>
            <div class="mt-4 pt-4 border-t flex justify-between gap-2 flex-shrink-0">
                <button id="prevButton" onclick="navigateRow(-1)" disabled class="flex items-center bg-gray-200 py-1.5 px-3 rounded-lg text-xs font-bold">Zurück</button>
                <button id="nextButton" onclick="navigateRow(1)" disabled class="flex items-center bg-indigo-500 text-white py-1.5 px-3 rounded-lg text-xs font-bold">Weiter</button>
            </div>
        </div>
    </div>
    
    <div id="snackbar" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 px-4 py-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none"></div>

    <script>
        let csvData = [], csvHeader = [], filteredData = [], currentFilteredIndex = -1, currentSort = { columnIndex: null, direction: 'asc' }; 
        const DATE_HEADERS = [ 'datum', 'date', 'tag', 'dat.', 'datuma', 'erstellungsdatum', 'rechnungsdatum', 'fälligkeitsdatum', 'beginn', 'ende', 'von', 'bis', 'monat', 'zul', 'eingabe', 'kaufdatum', 'gelesen robert', 'prüfdatum', 'änderung', 'aenderung', 'gebucht', 'valuta', 'gültig', 'gueltig', 'eingang', 'ausgang', 'versand', 'geburtstag', 'termin', 'frist', 'erstellt am', 'gültig von', 'gültig bis' ];
        const STORAGE_KEYS = { DATA: 'csvData', HEADER: 'csvHeader', STATE: 'searchState', SORT: 'currentSort', FILENAME: 'csvFileName' };

        const searchContainer = document.getElementById('searchContainer'), resultsOutput = document.getElementById('resultsOutput'), resultCount = document.getElementById('resultCount'), snackbar = document.getElementById('snackbar'), rowModal = document.getElementById('rowModal'), modalContent = document.getElementById('modalContent'), exportXlsxButton = document.getElementById('exportXlsxButton'), prevButton = document.getElementById('prevButton'), nextButton = document.getElementById('nextButton'), modalCounter = document.getElementById('modalCounter'), scrollToTopBtn = document.getElementById('scrollToTopBtn'), mainTitle = document.getElementById('mainTitle'), storageHint = document.getElementById('storageHint'), columnSelect1 = document.getElementById('columnSelect1'), searchInput1 = document.getElementById('searchInput1'), columnSelect2 = document.getElementById('columnSelect2'), searchInput2 = document.getElementById('searchInput2');

        function scrollToTop() { resultsOutput.scrollTo({ top: 0, behavior: 'smooth' }); }
        resultsOutput.onscroll = () => { scrollToTopBtn.classList.toggle('hidden', resultsOutput.scrollTop < 200 || filteredData.length === 0); };
        function showSnackbar(msg) { snackbar.textContent = msg; snackbar.classList.add('opacity-100'); setTimeout(() => snackbar.classList.remove('opacity-100'), 2500); }
        
        function updateExportButtonsState() { 
            const hasData = filteredData.length > 0;
            exportXlsxButton.disabled = !hasData;
            if (hasData) {
                exportXlsxButton.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                exportXlsxButton.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify({ col1: columnSelect1.value, input1: searchInput1.value, col2: columnSelect2.value, input2: searchInput2.value }));
            localStorage.setItem(STORAGE_KEYS.SORT, JSON.stringify(currentSort));
        }

        function loadState() {
            const d = localStorage.getItem(STORAGE_KEYS.DATA), h = localStorage.getItem(STORAGE_KEYS.HEADER), f = localStorage.getItem(STORAGE_KEYS.FILENAME);
            if (d && h) {
                try {
                    csvData = JSON.parse(d); csvHeader = JSON.parse(h);
                    if (f) { mainTitle.textContent = f; storageHint.classList.remove('hidden'); }
                    searchContainer.classList.remove('opacity-50', 'pointer-events-none');
                    populateColumnSelector();
                    const s = localStorage.getItem(STORAGE_KEYS.STATE);
                    if (s) { const st = JSON.parse(s); columnSelect1.value = st.col1 || 'all'; searchInput1.value = st.input1 || ''; columnSelect2.value = st.col2 || 'all'; searchInput2.value = st.input2 || ''; }
                    const so = localStorage.getItem(STORAGE_KEYS.SORT); if (so) { currentSort = JSON.parse(so); }
                    searchCSV(true); 
                } catch (e) { clearLocalStorage(); clearView(); }
            } else { clearView(); }
        }

        function clearLocalStorage() { Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k)); }
        function clearView() { csvData = []; csvHeader = []; filteredData = []; currentSort = { columnIndex: null, direction: 'asc' }; mainTitle.textContent = "Keine Datei geladen"; storageHint.classList.add('hidden'); searchContainer.classList.add('opacity-50', 'pointer-events-none'); resultsOutput.innerHTML = '<p class="text-gray-500 p-3 text-xs">Bitte Datei laden.</p>'; resultCount.textContent = '0'; updateExportButtonsState(); populateColumnSelector(); }

        function convertExcelDate(ed) {
            if (typeof ed !== 'number' || isNaN(ed) || ed < 1) return ed;
            const date = new Date(Date.UTC(1899, 11, 30) + (Math.floor(ed) - (ed > 60 ? 1 : 0)) * 86400000);
            return `${String(date.getUTCDate()).padStart(2, '0')}.${String(date.getUTCMonth() + 1).padStart(2, '0')}.${date.getUTCFullYear()}`;
        }
        function isDateColumn(h) { return h && DATE_HEADERS.some(k => h.toLowerCase().includes(k)); }
        function convertDateToExcelNumber(ds) {
            const p = ds.trim().replace(/[/,-]/g, '.').split('.'); if (p.length !== 3) return NaN;
            let d = parseInt(p[0]), m = parseInt(p[1]) - 1, y = parseInt(p[2]); if (y < 100) y += (y < 50 ? 2000 : 1900);
            const date = new Date(Date.UTC(y, m, d)); const excelStart = Date.UTC(1899, 11, 30);
            let en = (date.getTime() - excelStart) / 86400000; if (en > 59) en += 1; return en;
        }

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            mainTitle.textContent = file.name;
            storageHint.classList.add('hidden');
            localStorage.setItem(STORAGE_KEYS.FILENAME, file.name);

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    let parsed;
                    if (file.name.match(/\.xlsx$|\.xls$/i)) {
                        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        const arr = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
                        parsed = { header: arr[0].map(h => String(h||'').trim()), data: arr.slice(1).map((r, i) => ({ data: r.map(c => c ?? ''), originalLineNumber: i + 2 })) };
                    } else {
                        const lines = e.target.result.split(/\r?\n/).filter(l => l.trim() !== '');
                        const sep = (lines[0].split(';').length > lines[0].split(',').length) ? ';' : ',';
                        parsed = { header: lines[0].split(sep).map(c => c.trim().replace(/^"|"$/g, '')), data: lines.slice(1).map((l, i) => ({ data: l.split(sep).map(c => c.trim().replace(/^"|"$/g, '')), originalLineNumber: i + 2 })) };
                    }
                    csvHeader = parsed.header; csvData = parsed.data;
                    localStorage.setItem(STORAGE_KEYS.HEADER, JSON.stringify(csvHeader));
                    localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify(csvData));
                    resetSearchAndSortFields(); 
                    searchContainer.classList.remove('opacity-50', 'pointer-events-none');
                    populateColumnSelector(); searchCSV(true); saveState(); 
                } catch (err) { console.error(err); showSnackbar("Fehler beim Laden."); }
            };
            if (file.name.match(/\.xlsx$|\.xls$/i)) reader.readAsArrayBuffer(file); else reader.readAsText(file, 'UTF-8');
        }

        function populateColumnSelector() { const html = ['<option value="all">Alle Spalten</option>', ...csvHeader.map((h, i) => `<option value="${i}">${h || 'Sp. ' + (i + 1)}</option>`)].join(''); columnSelect1.innerHTML = html; columnSelect2.innerHTML = html; }
        function isCellEmpty(v) { return v === null || v === undefined || String(v).trim() === ''; }
        function getComparable(v) { if (isCellEmpty(v)) return null; const ds = String(v), dn = convertDateToExcelNumber(ds), n = parseFloat(ds.replace(',', '.')); return !isNaN(dn) ? dn : (!isNaN(n) ? n : ds); }
        function handleColumnChange(n) { searchCSV(); }

        function highlightText(text, term) {
            if (!term || term.match(/^(>=|<=|>|<|=)/) || term.toLowerCase() === 'leer' || term.toLowerCase() === 'nicht leer') return text;
            const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedTerm})`, 'gi');
            return String(text).replace(regex, '<mark>$1</mark>');
        }

        function searchCSV(showAll = false) {
            const t1 = searchInput1.value.trim(), c1 = columnSelect1.value, t2 = searchInput2.value.trim(), c2 = columnSelect2.value;
            if (csvData.length === 0) return;
            if (!t1 && !t2) { filteredData = [...csvData]; }
            else {
                const q = (t) => { const l = t.toLowerCase(); const m = t.match(/^(>=|<=|>|<|=)/); return m ? { type: 'comp', op: m[0], v: t.substring(m[0].length).trim() } : (l === 'leer' ? { type: 'empty' } : (l === 'nicht leer' ? { type: 'not_empty' } : { type: 'text', lv: l })); };
                const f = (row, query, col) => {
                    const check = (v) => {
                        if (query.type === 'empty') return isCellEmpty(v);
                        if (query.type === 'not_empty') return !isCellEmpty(v);
                        if (query.type === 'text') return String(v).toLowerCase().includes(query.lv);
                        if (query.type === 'comp') {
                            const cv = getComparable(v), sv = getComparable(query.v);
                            if (cv === null || sv === null) return false;
                            if (typeof cv === 'number' && typeof sv === 'number') {
                                switch(query.op) { case '>': return cv > sv; case '<': return cv < sv; case '>=': return cv >= sv; case '<=': return cv <= sv; case '=': return cv === sv; }
                            }
                            const res = new Intl.Collator('de').compare(String(cv), String(sv));
                            switch(query.op) { case '>': return res > 0; case '<': return res < 0; case '>=': return res >= 0; case '<=': return res <= 0; case '=': return res === 0; }
                        }
                        return true;
                    };
                    return col === 'all' ? row.data.some(v => check(v)) : check(row.data[parseInt(col)]);
                };
                const q1 = q(t1), q2 = t2 ? q(t2) : null;
                filteredData = csvData.filter(r => (t1 ? f(r, q1, c1) : true) && (t2 ? f(r, q2, c2) : true));
            }
            applyCurrentSort(); renderTable();
        }

        function applyCurrentSort() { if (currentSort.columnIndex === null) return; const mult = currentSort.direction === 'asc' ? 1 : -1; const coll = new Intl.Collator('de', { numeric: true }); filteredData.sort((a, b) => coll.compare(String(a.data[currentSort.columnIndex]), String(b.data[currentSort.columnIndex])) * mult); }
        function sortTable(i) { currentSort.direction = (currentSort.columnIndex === i && currentSort.direction === 'asc') ? 'desc' : 'asc'; currentSort.columnIndex = i; saveState(); applyCurrentSort(); renderTable(); }
        
        function renderTable() {
            resultCount.textContent = filteredData.length; updateExportButtonsState();
            if (filteredData.length === 0) { resultsOutput.innerHTML = '<p class="p-2 text-gray-500 text-xs">Keine Treffer.</p>'; return; }
            const t1 = searchInput1.value.trim(), t2 = searchInput2.value.trim();
            let h = '<table class="min-w-full divide-y divide-gray-200"><thead><tr>' + csvHeader.map((txt, i) => `<th class="px-3 py-2 text-left text-[10px] uppercase cursor-pointer hover:bg-gray-200" onclick="sortTable(${i})">${txt} ${currentSort.columnIndex === i ? (currentSort.direction === 'asc' ? '▲' : '▼') : '↕'}</th>`).join('') + '</tr></thead><tbody class="divide-y divide-gray-200">';
            filteredData.forEach((r, idx) => { 
                h += `<tr class="hover:bg-indigo-50 cursor-pointer" onclick="showRowPopup(${idx})">`;
                h += r.data.map((c, i) => {
                    let val = isDateColumn(csvHeader[i]) && typeof c === 'number' ? convertExcelDate(c) : c;
                    if (t1) val = highlightText(val, t1); if (t2) val = highlightText(val, t2);
                    return `<td class="px-3 py-1.5 text-xs text-gray-800">${val}</td>`;
                }).join(''); h += '</tr>';
            });
            resultsOutput.innerHTML = h + '</tbody></table>';
        }

        function exportAllResultsAsXLSX() {
            if (filteredData.length === 0) return;
            try {
                const sheetData = [csvHeader, ...filteredData.map(r => r.data)];
                const ws = XLSX.utils.aoa_to_sheet(sheetData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Export");
                XLSX.writeFile(wb, "export_gefiltert.xlsx");
                showSnackbar("Export erfolgreich!");
            } catch (err) { console.error(err); showSnackbar("Export fehlgeschlagen."); }
        }

        function resetSearchAndSortFields() { searchInput1.value = ''; columnSelect1.value = 'all'; searchInput2.value = ''; columnSelect2.value = 'all'; currentSort = { columnIndex: null, direction: 'asc' }; }

        function showRowPopup(idx) {
            currentFilteredIndex = idx; const r = filteredData[idx]; modalCounter.textContent = `${idx + 1}/${filteredData.length}`;
            prevButton.disabled = idx === 0; nextButton.disabled = idx === filteredData.length - 1;
            const t1 = searchInput1.value.trim(), t2 = searchInput2.value.trim();
            modalContent.innerHTML = csvHeader.map((h, i) => {
                let val = isDateColumn(h) && typeof r.data[i] === 'number' ? convertExcelDate(r.data[i]) : r.data[i];
                if (t1) val = highlightText(val, t1); if (t2) val = highlightText(val, t2);
                return `<div class="grid grid-cols-3 gap-2 py-2 border-b text-xs ${i % 2 ? 'bg-gray-50' : ''}"><span class="font-bold text-gray-600">${h}</span><span class="col-span-2 break-all">${val}</span></div>`;
            }).join('');
            rowModal.classList.replace('hidden', 'flex');
        }
        function closeRowPopup() { rowModal.classList.replace('flex', 'hidden'); }
        function navigateRow(d) { showRowPopup(currentFilteredIndex + d); }
        window.onload = loadState;
    </script>
</body>
</html>
