<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenbank</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .container { margin: 0 auto; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.7); z-index: 50; }
        .modal-fixed-height { display: flex; flex-direction: column; max-height: 90vh; }
        .modal-content-scroll { flex-grow: 1; overflow-y: auto; padding-bottom: 1rem; }
        
        .results-table-container { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            max-height: 65vh; 
            overflow-y: auto; 
        }
        .results-table-container table { 
            table-layout: auto; 
            border-collapse: collapse;
        }
        .results-table-container th, 
        .results-table-container td { 
            white-space: nowrap; 
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

    <div class="max-w-6xl container">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 id="main-title" class="text-3xl font-extrabold text-slate-900 tracking-tight">Datenbank</h1>
                <p id="storage-hint" class="text-sm text-emerald-600 font-medium mt-1 hidden">
                    ✓ Daten aus lokalem Speicher geladen
                </p>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <label class="flex items-center justify-center px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl shadow-sm cursor-pointer hover:bg-slate-50 transition-all font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    CSV Import
                    <input type="file" id="csv-file" accept=".csv" class="hidden">
                </label>
                
                <button onclick="exportToXLSX()" class="flex items-center justify-center px-4 py-2 bg-slate-900 text-white rounded-xl shadow-sm hover:bg-slate-800 transition-all font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Excel Export
                </button>
            </div>
        </div>

        <div id="search-container" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8 opacity-50 pointer-events-none transition-opacity">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Primärer Filter</label>
                    <div class="flex shadow-sm rounded-xl overflow-hidden border border-slate-200 focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                        <select id="column-select-1" class="bg-slate-50 border-r border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 outline-none w-1/3">
                            <option value="all">Alle Spalten</option>
                        </select>
                        <input type="text" id="search-input-1" placeholder="Suchen..." class="w-2/3 px-4 py-2 text-slate-900 outline-none">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Sekundärer Filter</label>
                    <div class="flex shadow-sm rounded-xl overflow-hidden border border-slate-200 focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                        <select id="column-select-2" class="bg-slate-50 border-r border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 outline-none w-1/3">
                            <option value="all">Alle Spalten</option>
                        </select>
                        <input type="text" id="search-input-2" placeholder="Suchen..." class="w-2/3 px-4 py-2 text-slate-900 outline-none">
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                <span id="results-count" class="text-sm font-bold text-slate-500 uppercase tracking-widest">Keine Daten geladen</span>
                <span class="text-xs text-slate-400 font-medium">Klick auf Zeile für Details</span>
            </div>
            <div class="results-table-container">
                <table class="w-full text-left text-sm">
                    <thead id="table-head" class="bg-white sticky top-0 z-10 border-b border-slate-200">
                        </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg modal-fixed-height">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-900">Datensatz-Details</h2>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400 hover:text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="modal-content" class="modal-content-scroll p-6 space-y-4">
                </div>
            <div class="p-4 bg-slate-50 border-t border-slate-100 rounded-b-3xl">
                <button onclick="closeModal()" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-colors">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEYS = {
            DATA: 'csv_data_store',
            HEADER: 'csv_header_store',
            FILENAME: 'csv_filename_store',
            STATE: 'csv_search_state',
            SORT: 'csv_sort_state'
        };

        let csvData = [];
        let csvHeader = [];
        let filteredData = [];
        let currentSort = { columnIndex: null, direction: 'asc' };

        const fileInput = document.getElementById('csv-file');
        const mainTitle = document.getElementById('main-title');
        const storageHint = document.getElementById('storage-hint');
        const searchContainer = document.getElementById('search-container');
        const columnSelect1 = document.getElementById('column-select-1');
        const columnSelect2 = document.getElementById('column-select-2');
        const searchInput1 = document.getElementById('search-input-1');
        const searchInput2 = document.getElementById('search-input-2');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const resultsCount = document.getElementById('results-count');
        const detailModal = document.getElementById('detail-modal');
        const modalContent = document.getElementById('modal-content');

        fileInput.addEventListener('change', handleFileUpload);
        [searchInput1, searchInput2, columnSelect1, columnSelect2].forEach(el => {
            el.addEventListener('input', () => searchCSV());
        });

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
                
                if (lines.length > 0) {
                    csvHeader = parseCSVLine(lines[0]);
                    csvData = lines.slice(1).map((line, idx) => ({
                        id: idx,
                        data: parseCSVLine(line)
                    }));

                    localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify(csvData));
                    localStorage.setItem(STORAGE_KEYS.HEADER, JSON.stringify(csvHeader));
                    localStorage.setItem(STORAGE_KEYS.FILENAME, file.name);
                    
                    mainTitle.textContent = file.name;
                    storageHint.classList.add('hidden');
                    searchContainer.classList.remove('opacity-50', 'pointer-events-none');
                    
                    populateColumnSelector();
                    searchCSV(true);
                }
            };
            reader.readAsText(file);
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ';' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else current += char;
            }
            result.push(current.trim());
            return result;
        }

        function populateColumnSelector() {
            const options = `<option value="all">Alle Spalten</option>` + 
                csvHeader.map((h, i) => `<option value="${i}">${h}</option>`).join('');
            columnSelect1.innerHTML = options;
            columnSelect2.innerHTML = options;
        }

        function searchCSV(resetSearch = false) {
            if (resetSearch) {
                searchInput1.value = ''; searchInput2.value = '';
                columnSelect1.value = 'all'; columnSelect2.value = 'all';
            }

            const val1 = searchInput1.value.toLowerCase();
            const col1 = columnSelect1.value;
            const val2 = searchInput2.value.toLowerCase();
            const col2 = columnSelect2.value;

            localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify({
                col1, input1: val1, col2, input2: val2
            }));

            filteredData = csvData.filter(row => {
                const match1 = col1 === 'all' 
                    ? row.data.some(cell => String(cell).toLowerCase().includes(val1))
                    : String(row.data[col1]).toLowerCase().includes(val1);
                
                const match2 = col2 === 'all'
                    ? row.data.some(cell => String(cell).toLowerCase().includes(val2))
                    : String(row.data[col2]).toLowerCase().includes(val2);
                
                return match1 && match2;
            });

            if (currentSort.columnIndex !== null) {
                applySort();
            } else {
                renderTable();
            }
        }

        function handleSort(index) {
            if (currentSort.columnIndex === index) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.columnIndex = index;
                currentSort.direction = 'asc';
            }
            localStorage.setItem(STORAGE_KEYS.SORT, JSON.stringify(currentSort));
            applySort();
        }

        function applySort() {
            const idx = currentSort.columnIndex;
            const dir = currentSort.direction === 'asc' ? 1 : -1;

            filteredData.sort((a, b) => {
                const valA = String(a.data[idx]);
                const valB = String(b.data[idx]);
                return valA.localeCompare(valB, undefined, {numeric: true, sensitivity: 'base'}) * dir;
            });

            renderTable();
        }

        function renderTable() {
            resultsCount.textContent = `${filteredData.length} Ergebnisse gefunden`;
            
            tableHead.innerHTML = `<tr>${csvHeader.map((h, i) => `
                <th onclick="handleSort(${i})" class="px-4 py-4 font-bold text-slate-700 cursor-pointer hover:bg-slate-50 transition-colors relative">
                    <div class="flex items-center">
                        ${h}
                        <span class="ml-2 text-slate-300">
                            ${currentSort.columnIndex === i ? (currentSort.direction === 'asc' ? '↑' : '↓') : '↕'}
                        </span>
                    </div>
                </th>`).join('')}</tr>`;

            tableBody.innerHTML = filteredData.map(row => `
                <tr onclick="showDetails(${row.id})" class="hover:bg-blue-50/50 cursor-pointer transition-colors group">
                    ${row.data.map(cell => `<td class="px-4 py-4 text-slate-600 border-b border-slate-50 group-last:border-none">${cell}</td>`).join('')}
                </tr>`).join('');
        }

        function showDetails(rowId) {
            const row = csvData.find(r => r.id === rowId);
            modalContent.innerHTML = csvHeader.map((h, i) => `
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">${h}</label>
                    <p class="text-slate-900 font-semibold break-words">${row.data[i] || '-'}</p>
                </div>`).join('');
            detailModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            detailModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function exportToXLSX() {
            const ws = XLSX.utils.aoa_to_sheet([csvHeader, ...filteredData.map(r => r.data)]);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Export");
            XLSX.writeFile(wb, "export.xlsx");
        }

        window.onload = () => {
            const d = localStorage.getItem(STORAGE_KEYS.DATA), h = localStorage.getItem(STORAGE_KEYS.HEADER);
            if (d && h) {
                csvData = JSON.parse(d); csvHeader = JSON.parse(h);
                mainTitle.textContent = localStorage.getItem(STORAGE_KEYS.FILENAME) || "Geladen";
                storageHint.classList.remove('hidden');
                searchContainer.classList.remove('opacity-50', 'pointer-events-none');
                populateColumnSelector();
                
                const s = JSON.parse(localStorage.getItem(STORAGE_KEYS.STATE) || '{}');
                columnSelect1.value = s.col1 || 'all'; searchInput1.value = s.input1 || '';
                columnSelect2.value = s.col2 || 'all'; searchInput2.value = s.input2 || '';
                
                const savedSort = localStorage.getItem(STORAGE_KEYS.SORT);
                if (savedSort) {
                    currentSort = JSON.parse(savedSort);
                } else {
                    currentSort = {columnIndex: null, direction: 'asc' };
                }
                
                searchCSV();
            }

            // Service Worker Registrierung
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(function(err) {
                    /* Fehler unterdrückt */
                });
            }
        };
    </script>
</body>
</html>
