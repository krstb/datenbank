<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenbank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .container { margin: 0 auto; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.7); z-index: 50; }
        .modal-fixed-height { display: flex; flex-direction: column; max-height: 90vh; }
        .modal-content-scroll { flex-grow: 1; overflow-y: auto; padding-bottom: 1rem; }
        .results-table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 65vh; overflow-y: auto; }
        .results-table-container table { table-layout: auto; }
        .results-table-container th, .results-table-container td { white-space: nowrap; width: 1%; }
        .results-table-container thead th { position: sticky; top: 0; z-index: 10; background-color: #e5e7eb; box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1); }
        
        /* Versteckt den Standard-Browser-Text "Keine Datei ausgewählt" komplett */
        input[type="file"]::file-selector-button {
            margin-right: 0;
        }
    </style>
</head>
<body class="p-1 sm:p-4">

    <div class="container bg-white shadow-2xl rounded-xl p-3 md:p-6 max-w-7xl">

        <h1 class="text-xl sm:text-2xl md:text-4xl font-extrabold text-gray-800 mb-4 md:mb-6 border-b pb-3 flex items-center flex-wrap gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8 text-indigo-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>Datenbank</span>
            <span id="mainTitle" class="text-sm sm:text-lg md:text-2xl font-medium text-gray-500 break-all border-l pl-2 ml-1">
                Keine Datei geladen
            </span>
            <span id="storageHint" class="text-[10px] sm:text-xs font-normal text-gray-400 italic hidden">(aus Speicher)</span>
        </h1>
        
        <div class="mb-6 p-2 md:p-3 border border-indigo-200 bg-indigo-50 rounded-lg flex flex-row items-center justify-between gap-2">
            <div class="flex-shrink-0">
                <input type="file" id="csvFile" 
                       accept=".csv, .xlsx, .xls, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" 
                       class="block w-28 sm:w-auto text-transparent cursor-pointer
                       file:py-1.5 file:px-3 sm:file:py-2 sm:file:px-4 file:rounded-full file:border-0 file:text-xs sm:file:text-sm file:font-semibold
                       file:bg-indigo-500 file:text-white hover:file:bg-indigo-600 file:cursor-pointer"
                       onchange="loadFile(event)">
                <p id="fileStatus" class="hidden"></p>
            </div>
            
            <div class="flex-shrink-0">
                 <button onclick="exportAllResultsAsXLSX()" id="exportXlsxButton" 
                   class="bg-green-600 hover:bg-green-700 text-white font-bold py-1.5 px-3 sm:py-2 sm:px-4 rounded-lg shadow-md transition duration-150 ease-in-out text-xs sm:text-sm opacity-50 pointer-events-none flex items-center"
                   disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 sm:mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    <span class="hidden sm:inline">Als XLSX herunterladen</span>
                    <span class="inline sm:hidden ml-1">XLSX</span>
                </button>
            </div>
        </div>

        <div id="searchContainer" class="mb-6 p-3 md:p-4 border border-gray-300 rounded-lg opacity-50 pointer-events-none transition duration-300 space-y-2">
            <label class="block text-base md:text-lg font-semibold text-gray-700">Suchkriterien</label>
            
            <div class="flex gap-2 md:gap-3 items-end">
                <div class="w-1/2">
                    <label for="columnSelect1" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Spalte:</label>
                    <select id="columnSelect1" class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="handleColumnChange(1); saveState();"></select>
                </div>
                <div class="w-1/2">
                    <label for="searchInput1" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Suchbegriff:</label>
                    <input type="text" id="searchInput1" placeholder="Müller, >10..." class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="searchCSV(); saveState();">
                </div>
            </div>

            <div class="flex items-center py-1">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-3 text-[10px] text-gray-400 font-bold">UND</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <div class="flex gap-2 md:gap-3 items-end">
                <div class="w-1/2">
                    <label for="columnSelect2" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Spalte:</label>
                    <select id="columnSelect2" class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="handleColumnChange(2); saveState();"></select>
                </div>
                <div class="w-1/2">
                    <label for="searchInput2" class="block text-[10px] sm:text-xs font-medium text-gray-700 mb-1 uppercase tracking-wider">Suchbegriff:</label>
                    <input type="text" id="searchInput2" placeholder="leer, nicht leer..." class="w-full p-1.5 sm:p-2 text-xs sm:text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="searchCSV(); saveState();">
                </div>
            </div>

            <div id="searchHint" class="hidden mt-2 p-2 text-[10px] sm:text-xs text-amber-900 bg-amber-100 border-l-4 border-amber-500 rounded-r-lg" role="alert">
                <strong>Hinweis:</strong> Für Vergleiche (>50) muss eine Spalte gewählt sein.
            </div>
        </div>
        <div class="mt-6 md:mt-10">
            <div class="flex flex-row justify-between items-center mb-3">
                <h2 id="resultsHeader" class="text-lg md:text-2xl font-bold text-gray-800"><span id="resultCount">0</span> Ergebnisse</h2>
            </div>
            <div id="resultsOutput" class="results-table-container shadow-inner bg-gray-50 rounded-lg">
                <p class="text-gray-500 p-3 text-xs sm:text-sm">Bitte Datei hochladen.</p>
            </div>
        </div>
    </div>

    <button id="scrollToTopBtn" onclick="scrollToTop()" class="hidden fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-full shadow-lg transition-opacity duration-300 z-20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
    </button>

    <div id="rowModal" class="fixed inset-0 hidden items-center justify-center modal-overlay" onclick="closeRowPopup()">
        <div class="bg-white rounded-xl shadow-2xl p-4 md:p-8 max-w-lg w-11/12 modal-fixed-height" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start border-b pb-2 mb-4 flex-shrink-0">
                <h3 class="text-lg font-bold text-gray-900">Details (<span id="modalCounter">1/1</span>)</h3>
                <button onclick="closeRowPopup()" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="modalContent" class="modal-content-scroll text-xs sm:text-sm"></div>
            <div class="mt-4 pt-4 border-t flex justify-between gap-2 flex-shrink-0">
                <button id="prevButton" onclick="navigateRow(-1)" disabled class="flex items-center bg-gray-200 py-1.5 px-3 rounded-lg text-xs font-bold">
                    Zurück
                </button>
                <button id="nextButton" onclick="navigateRow(1)" disabled class="flex items-center bg-indigo-500 text-white py-1.5 px-3 rounded-lg text-xs font-bold">
                    Weiter
                </button>
            </div>
        </div>
    </div>
    
    <div id="snackbar" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 px-4 py-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none"></div>

    <script>
        let csvData = [];
        let csvHeader = [];
        let filteredData = [];
        let currentFilteredIndex = -1;
        let currentSort = { columnIndex: null, direction: 'asc' }; 
        
        const DATE_HEADERS = [ 'datum', 'date', 'tag', 'dat.', 'datuma', 'erstellungsdatum', 'rechnungsdatum', 'fälligkeitsdatum', 'beginn', 'ende', 'von', 'bis', 'monat', 'zul', 'eingabe', 'kaufdatum', 'gelesen robert', 'prüfdatum', 'änderung', 'aenderung', 'gebucht', 'valuta', 'gültig', 'gueltig', 'eingang', 'ausgang', 'versand', 'geburtstag', 'termin', 'frist', 'erstellt am', 'gültig von', 'gültig bis' ];
        const NON_DATE_HEADERS = ['jahr', 'year'];
        
        const searchContainer = document.getElementById('searchContainer');
        const fileStatus = document.getElementById('fileStatus');
        const resultsOutput = document.getElementById('resultsOutput');
        const resultCount = document.getElementById('resultCount');
        const snackbar = document.getElementById('snackbar');
        const rowModal = document.getElementById('rowModal');
        const modalContent = document.getElementById('modalContent');
        const exportXlsxButton = document.getElementById('exportXlsxButton');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        const modalCounter = document.getElementById('modalCounter');
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        const searchHint = document.getElementById('searchHint');
        const mainTitle = document.getElementById('mainTitle');
        const storageHint = document.getElementById('storageHint');
        
        const columnSelect1 = document.getElementById('columnSelect1');
        const searchInput1 = document.getElementById('searchInput1');
        const columnSelect2 = document.getElementById('columnSelect2');
        const searchInput2 = document.getElementById('searchInput2');
        
        const STORAGE_KEYS = {
            DATA: 'csvData',
            HEADER: 'csvHeader',
            STATE: 'searchState',
            SORT: 'currentSort',
            FILENAME: 'csvFileName'
        };

        function scrollToTop() { resultsOutput.scrollTo({ top: 0, behavior: 'smooth' }); }
        resultsOutput.onscroll = () => { scrollToTopBtn.classList.toggle('hidden', resultsOutput.scrollTop < 200 || filteredData.length === 0); };
        function showSnackbar(message) {
            snackbar.textContent = message;
            snackbar.classList.add('opacity-100');
            setTimeout(() => snackbar.classList.remove('opacity-100'), 2500);
        }
        
        function saveState() {
            localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify({
                col1: columnSelect1.value,
                input1: searchInput1.value,
                col2: columnSelect2.value,
                input2: searchInput2.value
            }));
            localStorage.setItem(STORAGE_KEYS.SORT, JSON.stringify(currentSort));
        }

        function loadState() {
            const savedData = localStorage.getItem(STORAGE_KEYS.DATA);
            const savedHeader = localStorage.getItem(STORAGE_KEYS.HEADER);
            const savedFileName = localStorage.getItem(STORAGE_KEYS.FILENAME);

            if (savedData && savedHeader) {
                try {
                    csvData = JSON.parse(savedData);
                    csvHeader = JSON.parse(savedHeader);
                    if (savedFileName) { 
                        mainTitle.textContent = savedFileName; 
                        storageHint.classList.remove('hidden');
                    }
                    searchContainer.classList.remove('opacity-50', 'pointer-events-none');
                    populateColumnSelector();
                    const savedState = localStorage.getItem(STORAGE_KEYS.STATE);
                    if (savedState) {
                        const state = JSON.parse(savedState);
                        columnSelect1.value = state.col1 || 'all';
                        searchInput1.value = state.input1 || '';
                        columnSelect2.value = state.col2 || 'all';
                        searchInput2.value = state.input2 || '';
                    }
                    const savedSort = localStorage.getItem(STORAGE_KEYS.SORT);
                    if (savedSort) { currentSort = JSON.parse(savedSort); }
                    searchCSV(true); 
                } catch (e) {
                    clearLocalStorage(); clearView();
                }
            } else { clearView(); }
        }

        function clearLocalStorage() {
            localStorage.removeItem(STORAGE_KEYS.DATA);
            localStorage.removeItem(STORAGE_KEYS.HEADER);
            localStorage.removeItem(STORAGE_KEYS.STATE);
            localStorage.removeItem(STORAGE_KEYS.SORT);
            localStorage.removeItem(STORAGE_KEYS.FILENAME);
        }

        function clearView() {
            csvData = []; csvHeader = []; filteredData = [];
            currentSort = { columnIndex: null, direction: 'asc' };
            mainTitle.textContent = "Keine Datei geladen";
            storageHint.classList.add('hidden');
            searchContainer.classList.add('opacity-50', 'pointer-events-none');
            resultsOutput.innerHTML = '<p class="text-gray-500 p-3 text-xs">Bitte Datei laden.</p>';
            resultCount.textContent = '0';
            updateExportButtonsState(); populateColumnSelector();
        }

        function convertExcelDate(excelDate) {
            if (typeof excelDate !== 'number' || isNaN(excelDate) || excelDate < 1) return excelDate;
            const days = Math.floor(excelDate) - (excelDate > 60 ? 1 : 0);
            const milliseconds = (days * 86400000) + ((excelDate % 1) * 86400000);
            const date = new Date(Date.UTC(1899, 11, 30) + milliseconds);
            if (date.getFullYear() < 1900 || date.getFullYear() > 2200) return excelDate;
            return `${String(date.getUTCDate()).padStart(2, '0')}.${String(date.getUTCMonth() + 1).padStart(2, '0')}.${date.getUTCFullYear()}`;
        }
        function isDateColumn(headerText) {
            if (!headerText) return false;
            const lowerHeader = String(headerText).trim().toLowerCase(); 
            if (NON_DATE_HEADERS.includes(lowerHeader)) return false;
            return DATE_HEADERS.some(dateKeyword => lowerHeader.includes(dateKeyword));
        }
        function convertDateToExcelNumber(dateString) {
            if (typeof dateString !== 'string' || dateString.trim() === '') return NaN;
            const normalized = dateString.trim().replace(/[/,-]/g, '.');
            const parts = normalized.split('.');
            if (parts.length !== 3) return NaN;
            const day = parseInt(parts[0], 10), month = parseInt(parts[1], 10) - 1;
            let year = parseInt(parts[2], 10);
            if (isNaN(day) || isNaN(month) || isNaN(year)) return NaN;
            if (year >= 0 && year < 100) year += (year < 50 ? 2000 : 1900);
            const date = new Date(Date.UTC(year, month, day));
            if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month || date.getUTCDate() !== day) return NaN;
            const excelStart = Date.UTC(1899, 11, 30);
            let excelNumber = (date.getTime() - excelStart) / 86400000;
            if (excelNumber > 59) excelNumber += 1;
            return excelNumber < 1 ? NaN : excelNumber;
        }

        function parseCSVRow(rowText, delimiter) { return rowText.split(delimiter).map(cell => cell.trim().replace(/^"|"$/g, '').trim()); }
        function formatSheetData(sheetArray) {
            if (sheetArray.length === 0) return { header: [], data: [] };
            const header = sheetArray[0].map(h => String(h || '').trim());
            const data = sheetArray.slice(1).map((row, index) => ({ 
                data: row.map(cell => cell === null || cell === undefined ? '' : cell), 
                originalLineNumber: index + 2 
            }));
            return { header, data };
        }
        
        function resetSearchAndSortFields() {
            searchInput1.value = ''; columnSelect1.value = 'all';
            searchInput2.value = ''; columnSelect2.value = 'all';
            currentSort = { columnIndex: null, direction: 'asc' };
        }
        
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            mainTitle.textContent = file.name;
            storageHint.classList.add('hidden');
            localStorage.setItem(STORAGE_KEYS.FILENAME, file.name);
            resetSearchAndSortFields(); 
            const isXlsx = file.name.toLowerCase().endsWith('.xlsx') || file.name.toLowerCase().endsWith('.xls');
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    let parsedData;
                    if (isXlsx) {
                        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        const sheetArray = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, raw: true, defval: "" });
                        parsedData = formatSheetData(sheetArray);
                    } else {
                        const content = e.target.result;
                        const lines = content.replace(/\r\n/g, '\n').split('\n').filter(line => line.trim() !== '');
                        const delimiter = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';
                        parsedData = {
                            header: parseCSVRow(lines[0], delimiter),
                            data: lines.slice(1).map((line, index) => ({ data: parseCSVRow(line, delimiter), originalLineNumber: index + 2 }))
                        };
                    }
                    csvHeader = parsedData.header; csvData = parsedData.data;
                    localStorage.setItem(STORAGE_KEYS.HEADER, JSON.stringify(csvHeader));
                    localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify(csvData));
                    searchContainer.classList.remove('opacity-50', 'pointer-events-none');
                    populateColumnSelector(); searchCSV(true); saveState(); 
                } catch (error) { console.error(error); }
            };
            if (isXlsx) { reader.readAsArrayBuffer(file); } else { reader.readAsText(file, 'UTF-8'); }
        }

        function populateColumnSelector() {
            const optionsHtml = ['<option value="all">Alle Spalten</option>', ...csvHeader.map((header, index) => `<option value="${index}">${header || 'Sp. ' + (index + 1)}</option>`)].join('');
            columnSelect1.innerHTML = optionsHtml; columnSelect2.innerHTML = optionsHtml;
        }
        
        function isCellEmpty(cellValue) { return cellValue === null || cellValue === undefined || String(cellValue).trim() === ''; }
        function getComparableValue(value) {
            if (isCellEmpty(value)) return null;
            if (typeof value === 'number') return value;
            const dateNum = convertDateToExcelNumber(String(value));
            if (!isNaN(dateNum)) return dateNum;
            const num = parseFloat(String(value).replace(',', '.'));
            return !isNaN(num) ? num : String(value);
        }
        function parseSearchQuery(term) {
            const lowerTerm = term.toLowerCase();
            if (lowerTerm === 'leer') return { type: 'empty' };
            if (lowerTerm === 'nicht leer') return { type: 'not_empty' };
            const operatorMatch = term.match(/^(>=|<=|>|<|=)/);
            if (operatorMatch) return { type: 'comparison', operator: operatorMatch[0], value: term.substring(operatorMatch[0].length).trim() };
            return { type: 'text', value: term, lowerValue: lowerTerm };
        }
        function performComparison(cellValue, operator, comparisonValueString) {
            const comparableCellValue = getComparableValue(cellValue);
            const comparableSearchValue = getComparableValue(comparisonValueString);
            if (comparableCellValue === null || comparableSearchValue === null) return false;
            if (typeof comparableCellValue === 'number' && typeof comparableSearchValue === 'number') {
                switch (operator) {
                    case '>': return comparableCellValue > comparableSearchValue;
                    case '<': return comparableCellValue < comparableSearchValue;
                    case '>=': return comparableCellValue >= comparableSearchValue;
                    case '<=': return comparableCellValue <= comparableSearchValue;
                    case '=': return comparableCellValue === comparableSearchValue;
                }
            }
            const collator = new Intl.Collator('de', { sensitivity: 'base' });
            const res = collator.compare(String(comparableCellValue), String(comparableSearchValue));
            switch (operator) {
                case '>': return res > 0; case '<': return res < 0; case '>=': return res >= 0; case '<=': return res <= 0; case '=': return res === 0;
            }
            return false;
        }
        
        function checkRowAgainstQuery(rowObj, query, selectedColumnIndex) {
            const checkCell = (idx) => {
                const val = rowObj.data[idx];
                if (query.type === 'empty') return isCellEmpty(val);
                if (query.type === 'not_empty') return !isCellEmpty(val);
                if (query.type === 'text') return String(val).toLowerCase().includes(query.lowerValue);
                if (query.type === 'comparison') return performComparison(val, query.operator, query.value);
                return true;
            };
            return selectedColumnIndex === 'all' ? rowObj.data.some((_, i) => checkCell(i)) : checkCell(parseInt(selectedColumnIndex));
        }

        function searchCSV(showAll = false) {
            const term1 = searchInput1.value.trim(), col1 = columnSelect1.value;
            const term2 = searchInput2.value.trim(), col2 = columnSelect2.value;
            if (csvData.length === 0) return;
            if (!term1 && !term2) { searchHint.classList.add('hidden'); filteredData = [...csvData]; }
            else {
                const q1 = parseSearchQuery(term1), q2 = term2 ? parseSearchQuery(term2) : null;
                if ((q1.type === 'comparison' && col1 === 'all') || (q2 && q2.type === 'comparison' && col2 === 'all')) {
                    searchHint.classList.remove('hidden'); filteredData = [];
                } else {
                    searchHint.classList.add('hidden');
                    filteredData = csvData.filter(row => {
                        const m1 = term1 ? checkRowAgainstQuery(row, q1, col1) : true;
                        const m2 = term2 ? checkRowAgainstQuery(row, q2, col2) : true;
                        return m1 && m2;
                    });
                }
            }
            applyCurrentSort(); renderTable();
        }

        function handleColumnChange(idx) { searchCSV(); }
        function applyCurrentSort() {
            if (currentSort.columnIndex === null) return;
            const { columnIndex, direction } = currentSort;
            const mult = direction === 'asc' ? 1 : -1;
            const collator = new Intl.Collator('de', { sensitivity: 'base', numeric: true });
            filteredData.sort((a, b) => {
                const vA = getComparableValue(a.data[columnIndex]), vB = getComparableValue(b.data[columnIndex]);
                if (vA === null && vB === null) return 0; if (vA === null) return 1; if (vB === null) return -1;
                return collator.compare(String(vA), String(vB)) * mult;
            });
        }
        function sortTable(idx) {
            currentSort.direction = (currentSort.columnIndex === idx && currentSort.direction === 'asc') ? 'desc' : 'asc';
            currentSort.columnIndex = idx;
            saveState(); applyCurrentSort(); renderTable();
        }

        function renderTable() {
            resultCount.textContent = filteredData.length;
            updateExportButtonsState();
            if (filteredData.length === 0) { resultsOutput.innerHTML = '<p class="p-2 text-gray-500 text-xs">Keine Treffer.</p>'; return; }
            let html = '<table class="min-w-full divide-y divide-gray-200"><thead><tr>';
            csvHeader.forEach((h, i) => {
                const icon = currentSort.columnIndex === i ? (currentSort.direction === 'asc' ? '▲' : '▼') : '↕';
                html += `<th class="px-3 py-2 text-left text-[10px] font-medium text-gray-700 uppercase cursor-pointer hover:bg-gray-200" onclick="sortTable(${i})">${h} ${icon}</th>`;
            });
            html += '</tr></thead><tbody class="bg-white divide-y divide-gray-200">';
            filteredData.forEach((row, rIdx) => {
                html += `<tr class="hover:bg-indigo-50 cursor-pointer" onclick="showRowPopup(${rIdx})">`;
                row.data.forEach((cell, cIdx) => { html += `<td class="px-3 py-1.5 text-xs text-gray-800">${getCellDisplayValue(cell, csvHeader[cIdx])}</td>`; });
                html += '</tr>';
            });
            resultsOutput.innerHTML = html + '</tbody></table>';
        }

        function updateExportButtonsState() {
            const d = filteredData.length === 0;
            exportXlsxButton.disabled = d; exportXlsxButton.classList.toggle('opacity-50', d);
        }
        function exportAllResultsAsXLSX() {
            const ws = XLSX.utils.aoa_to_sheet([csvHeader, ...filteredData.map(r => r.data)]);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Export");
            XLSX.writeFile(wb, "export.xlsx");
        }
        function getCellDisplayValue(val, h) {
            if (isCellEmpty(val)) return '';
            return isDateColumn(h) && typeof val === 'number' ? convertExcelDate(val) : String(val);
        }
        function showRowPopup(idx) {
            currentFilteredIndex = idx; const row = filteredData[idx];
            modalCounter.textContent = `${idx + 1}/${filteredData.length}`;
            prevButton.disabled = idx === 0; nextButton.disabled = idx === filteredData.length - 1;
            modalContent.innerHTML = csvHeader.map((h, i) => `
                <div class="grid grid-cols-3 gap-2 py-2 border-b text-xs ${i % 2 ? 'bg-gray-50' : ''}">
                    <span class="font-bold text-gray-600">${h}</span>
                    <span class="col-span-2 break-all">${getCellDisplayValue(row.data[i], h)}</span>
                </div>`).join('');
            rowModal.classList.replace('hidden', 'flex');
        }
        function closeRowPopup() { rowModal.classList.replace('flex', 'hidden'); }
        function navigateRow(d) { showRowPopup(currentFilteredIndex + d); }
        
        window.onload = loadState;
    </script>
</body>
</html>
